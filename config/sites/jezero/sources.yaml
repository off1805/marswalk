# Sources de données brutes pour le site Jezero (D1).
# Télécharger via D0 (pipeline/marswalk_pipeline/fetch/) ou manuellement depuis Mars Trek.
# Format : identifiant du produit PDS, URL, date de prise de vue.
# Ce fichier est géré par D1 (ownership.yaml).
#
# Les fichiers réels présents dans data/raw/jezero/ sont référencés ici.
# Mise à jour Phase 3 : correction des noms de fichiers pour correspondre aux
# fichiers téléchargés (noms PDS/Mars Trek complets).

layers:
  hirise_vis:
    instrument: HiRISE
    mission: MRO
    product_id: JEZ_hirise_soc_006
    url: https://www.uahirise.org/ESP_046060_1985
    date: "2016-10-18"
    file: JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first_dd.tif
    resolution_m: 0.25
    note: "Ortho-mosaïque HiRISE 25 cm, CRS géographique (longlat +R=3396190) → reprojection automatique"

  hirise_dem:
    instrument: HiRISE
    mission: MRO
    product_id: JEZ_hirise_soc_006_DTM
    url: https://www.uahirise.org/dtm/dtm.php?ID=ESP_024919_1985
    date: "2012-03-07"
    file: JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif
    resolution_m: 1.0
    note: "MNT HiRISE DTM aligné MOLA, 1 m/px, ESRI:103885, NoData=-3.4e38"

  ctx_vis:
    instrument: CTX
    mission: MRO
    product_id: JEZ_ctx_B_soc_008
    url: https://www.mars.asu.edu/data/ctx/
    date: "2008-11-09"
    file: JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.tif
    resolution_m: 6.0
    note: "Ortho-mosaïque CTX 6 m/px, ESRI:103885, NoData=0"

  ctx_dem:
    instrument: CTX
    mission: MRO
    product_id: M20_JezeroCrater_CTXDEM_20m
    url: https://astrogeology.usgs.gov/
    date: "2021-01-01"
    file: M20_JezeroCrater_CTXDEM_20m.tif
    resolution_m: 20.0
    note: "MNT CTX 20 m/px, EQC lat_ts=18.4663 → reprojection obligatoire, NoData=-3.4e38"

  dem_mola:
    instrument: MOLA
    mission: MGS
    product_id: Mars_MGS_MOLA_DEM_mosaic_global_463m
    url: https://astrogeology.usgs.gov/search/details/Mars/GlobalSurveyor/MOLA/Mars_MGS_MOLA_DEM_mosaic_global_463m/cub
    date: "2003-01-01"
    file: Mars_MGS_MOLA_DEM_mosaic_global_463m.tif
    resolution_m: 463.0
    note: "MNT MOLA global 463 m/px, int16, NoData=-32768, repli si HiRISE/CTX ne couvrent pas"

  thermal_inertia:
    instrument: THEMIS
    mission: Mars Odyssey
    product_id: Jezero_Thermal_Inertia_v1
    url: https://astrogeology.usgs.gov/search/map/Mars/Odyssey/THEMIS-IR-Thermal/
    date: "2014-01-01"
    file: Jezero_Thermal_Inertia_v1.tiff
    resolution_m: 100.0
    note: "Inertie thermique THEMIS 100 m/px, NoData=0.0 (pré-masquage requis)"

  crism_minerals:
    instrument: CRISM
    mission: MRO
    product_id: jezeroFinal
    url: https://pds-geosciences.wustl.edu/mro/mro-m-crism-3-rdr-targeted-v1/
    date: "2008-11-09"
    file: jezeroFinal.tif
    resolution_m: 36.0
    note: "Carte CRISM RGB 3-bandes uint8, 36 m/px, nearest neighbour obligatoire"
