# Racine de l'espace de travail uv de Marswalk (fichier partagé : ajout de dépendances seulement).
[project]
name = "marswalk"
version = "0.1.0"
description = "Marswalk : carte et planification de sorties sur Mars (cratère Gale)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marswalk-core",
    "marswalk-pipeline",
    "marswalk-planner",
    "marswalk-conditions",
    "marswalk-api",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "pipeline", "planner", "conditions", "api"]

[tool.uv.sources]
marswalk-core = { workspace = true }
marswalk-pipeline = { workspace = true }
marswalk-planner = { workspace = true }
marswalk-conditions = { workspace = true }
marswalk-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "node_modules", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "marswalk_core",
    "marswalk_pipeline",
    "marswalk_planner",
    "marswalk_conditions",
    "marswalk_api",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core:pipeline:planner:conditions:api:tools"
explicit_package_bases = true
exclude = ["(^|/)migrations/versions/", "(^|/)web/", "(^|/)node_modules/"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "affine.*", "geoalchemy2.*", "shapely.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "marswalk_planner._p1.masks",
    "marswalk_planner._p2.astar",
    "tests.p1.test_performance",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "pipeline/tests", "planner/tests", "conditions/tests", "api/tests", "tools/tests"]
addopts = "-q --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: tests qui demandent PostGIS (MARSWALK_DATABASE_URL)",
]
