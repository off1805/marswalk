[project]
name = "marswalk-api"
version = "0.1.0"
description = "API FastAPI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marswalk-core",
    "marswalk-planner",
    "marswalk-conditions",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.16",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marswalk_api"]
