[project]
name = "marswalk-conditions"
version = "0.1.0"
description = "Conditions martiennes et scénarios"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marswalk-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marswalk_conditions"]
