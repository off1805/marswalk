[project]
name = "marswalk-pipeline"
version = "0.1.0"
description = "Pipeline de données (ingestion, recalage, couches dérivées, paquet)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "marswalk-core",
    "pillow>=11.0",
    "scipy>=1.14",
    "PyYAML>=6.0",
]

[project.scripts]
marswalk-ingest = "marswalk_pipeline.ingest._cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marswalk_pipeline"]
