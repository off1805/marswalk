# Nginx — reverse proxy de production Marswalk
# Remplace ${DOMAIN} par le nom de domaine réel avant de lancer (fait par le script deploy.sh).
#
# Rôles :
#   - Terminer TLS (certificat Let's Encrypt via Certbot)
#   - Proxy HTTP vers Uvicorn pour /api/* et /tiles/*
#   - Upgrade WebSocket pour /ws/*
#   - Propager les en-têtes de proxy pour que FastAPI voie la vraie IP et le vrai protocole
#   - Renouvellement automatique Let's Encrypt via /.well-known/acme-challenge/

upstream api_backend {
    server api:8000;
    keepalive 32;
}

# ── HTTP : uniquement pour le renouvellement ACME et la redirection vers HTTPS ──
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/MARSWALK_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/MARSWALK_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # En-têtes propagés à FastAPI (nécessaires pour --proxy-headers d'Uvicorn)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── REST API (/api/*) ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        # Désactive la mise en tampon pour les réponses SSE éventuelles
        proxy_buffering off;
    }

    # ── Tuiles statiques (/tiles/*) ──────────────────────────────────────────
    # FastAPI émet Cache-Control: public, max-age=86400 — on le laisse passer.
    location /tiles/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        # Pas de proxy_buffering off : les images peuvent être mise en tampon
    }

    # ── WebSocket EVA (/ws/*) ────────────────────────────────────────────────
    # CloudFront doit avoir un behavior /ws/* avec cache désactivé et
    # HTTP/1.1 keepalive activé pour que l'upgrade fonctionne.
    location /ws/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # ── Toute autre URL : 404 ────────────────────────────────────────────────
    # Le frontend est hébergé sur S3/CloudFront, pas sur cette instance.
    location / {
        return 404 "Not served here — frontend is on S3/CloudFront.\n";
        add_header Content-Type text/plain;
    }
}
