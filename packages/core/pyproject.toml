[project]
name = "marswalk-core"
version = "0.1.0"
description = "Bibliothèque commune (schémas, paquet de site, temps, géodésie)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
    "xarray>=2024.10",
    "rasterio>=1.4",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marswalk_core"]
