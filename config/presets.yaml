# Préréglages d'affichage du panneau de couches (créé par T00, valeurs réglées par F1).
# Une couche absente d'un préréglage est masquée.
presets:
  safety:
    title: Safety
    layers:
      hillshade: { visible: true, opacity: 1.0 }
      slope: { visible: true, opacity: 0.6 }
      scarps: { visible: true, opacity: 0.8 }
      obstacles: { visible: true, opacity: 0.8 }
      radio_coverage: { visible: false, opacity: 0.5 }
      rover_traverse: { visible: true, opacity: 0.8 }
      ground_images: { visible: true, opacity: 1.0 }
  science:
    title: Science
    layers:
      hirise_vis: { visible: true, opacity: 1.0 }
      crism_minerals: { visible: true, opacity: 0.6 }
      thermal_inertia: { visible: false, opacity: 0.6 }
      rover_traverse: { visible: true, opacity: 1.0 }
      ground_images: { visible: true, opacity: 1.0 }
  navigation:
    title: Navigation
    layers:
      hirise_vis: { visible: true, opacity: 1.0 }
      hillshade: { visible: false, opacity: 0.5 }
      rover_traverse: { visible: true, opacity: 1.0 }
      radio_coverage: { visible: false, opacity: 0.4 }
      ground_images: { visible: true, opacity: 1.0 }
